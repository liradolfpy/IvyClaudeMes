<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img"><title>Skills library versus installed account skills</title>
<style>
text{font-family:"Segoe UI",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>rect{fill:#F1EFE8;stroke:#888780}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
</style>
<rect width="680" height="460" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="30" y="30" width="270" height="300" rx="20" stroke-width="0.5"/><text class="th" x="165" y="56" text-anchor="middle" dominant-baseline="central">Skills library</text><text class="ts" x="165" y="74" text-anchor="middle" dominant-baseline="central">On your computer (ClaudeSkills)</text></g>
<g class="c-teal"><rect x="50" y="94" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="165" y="112" text-anchor="middle" dominant-baseline="central">SKILL.md</text><text class="ts" x="165" y="132" text-anchor="middle" dominant-baseline="central">The library file: the rules</text></g>
<g class="c-gray"><rect x="50" y="168" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="165" y="186" text-anchor="middle" dominant-baseline="central">references/</text><text class="ts" x="165" y="206" text-anchor="middle" dominant-baseline="central">Detail, read only if needed</text></g>
<g class="c-gray"><rect x="50" y="242" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="165" y="260" text-anchor="middle" dominant-baseline="central">CHANGELOG.md</text><text class="ts" x="165" y="280" text-anchor="middle" dominant-baseline="central">History, not read in tasks</text></g>
<g class="c-gray"><rect x="380" y="30" width="270" height="300" rx="20" stroke-width="0.5"/><text class="th" x="515" y="56" text-anchor="middle" dominant-baseline="central">Installed account skill</text><text class="ts" x="515" y="74" text-anchor="middle" dominant-baseline="central">In your Claude settings</text></g>
<g class="c-coral"><rect x="400" y="94" width="230" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="515" y="112" text-anchor="middle" dominant-baseline="central">Before: full copy</text><text class="ts" x="515" y="132" text-anchor="middle" dominant-baseline="central">Whole file, 43 KB of rules</text></g>
<g class="c-teal"><rect x="400" y="168" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515" y="186" text-anchor="middle" dominant-baseline="central">Now: pointer</text><text class="ts" x="515" y="206" text-anchor="middle" dominant-baseline="central">1 KB: "read the library file"</text></g>
<g class="c-gray"><rect x="400" y="242" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515" y="260" text-anchor="middle" dominant-baseline="central">Name and description</text><text class="ts" x="515" y="280" text-anchor="middle" dominant-baseline="central">Decide when it triggers</text></g>
<path d="M400 196 L340 196 L340 122 L284 122" class="arr" marker-end="url(#arrow)"/><text class="ts" x="340" y="214" text-anchor="middle" dominant-baseline="central">reads</text>
<g class="c-amber"><rect x="400" y="372" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="515" y="390" text-anchor="middle" dominant-baseline="central">Review card</text><text class="ts" x="515" y="410" text-anchor="middle" dominant-baseline="central">You click save to replace it</text></g>
<line x1="515" y1="370" x2="515" y2="334" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="50" y="372" width="230" height="56" rx="8" stroke-width="0.5"/><text class="th" x="165" y="390" text-anchor="middle" dominant-baseline="central">Rule</text><text class="ts" x="165" y="410" text-anchor="middle" dominant-baseline="central">One line in SKILL.md</text></g>
</svg>
