<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img"><title>How a task uses a skill and how a rule change flows</title>
<style>
text{font-family:"Segoe UI",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>rect{fill:#F1EFE8;stroke:#888780}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
</style>
<rect width="680" height="520" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="180" y="30" text-anchor="middle" dominant-baseline="central">When a task runs</text><text class="th" x="500" y="30" text-anchor="middle" dominant-baseline="central">When you change a rule</text>
<g class="c-gray"><rect x="40" y="52" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="70" text-anchor="middle" dominant-baseline="central">Your brief arrives</text><text class="ts" x="180" y="90" text-anchor="middle" dominant-baseline="central">"Query screens for matl"</text></g>
<g class="c-teal"><rect x="40" y="136" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="154" text-anchor="middle" dominant-baseline="central">Installed skill triggers</text><text class="ts" x="180" y="174" text-anchor="middle" dominant-baseline="central">Pointer: go read the library</text></g>
<g class="c-teal"><rect x="40" y="220" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="238" text-anchor="middle" dominant-baseline="central">Read SKILL.md (10 KB)</text><text class="ts" x="180" y="258" text-anchor="middle" dominant-baseline="central">Always the latest rules</text></g>
<g class="c-gray"><rect x="40" y="304" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="322" text-anchor="middle" dominant-baseline="central">Generator does the work</text><text class="ts" x="180" y="342" text-anchor="middle" dominant-baseline="central">--digest, --propose, generate</text></g>
<g class="c-gray"><rect x="40" y="388" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="406" text-anchor="middle" dominant-baseline="central">Checker confirms</text><text class="ts" x="180" y="426" text-anchor="middle" dominant-baseline="central">--check: 0 findings</text></g>
<line x1="180" y1="108" x2="180" y2="132" class="arr" marker-end="url(#arrow)"/><line x1="180" y1="192" x2="180" y2="216" class="arr" marker-end="url(#arrow)"/><line x1="180" y1="276" x2="180" y2="300" class="arr" marker-end="url(#arrow)"/><line x1="180" y1="360" x2="180" y2="384" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="360" y="52" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="70" text-anchor="middle" dominant-baseline="central">You ask for a change</text><text class="ts" x="500" y="90" text-anchor="middle" dominant-baseline="central">"Add queryLayout"</text></g>
<g class="c-teal"><rect x="360" y="136" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="154" text-anchor="middle" dominant-baseline="central">Edit the library file</text><text class="ts" x="500" y="174" text-anchor="middle" dominant-baseline="central">SKILL.md + CHANGELOG row</text></g>
<g class="c-gray"><rect x="360" y="220" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="238" text-anchor="middle" dominant-baseline="central">Update generator</text><text class="ts" x="500" y="258" text-anchor="middle" dominant-baseline="central">Regenerate 109 files, check</text></g>
<g class="c-gray"><rect x="360" y="304" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="322" text-anchor="middle" dominant-baseline="central">Log the decision</text><text class="ts" x="500" y="342" text-anchor="middle" dominant-baseline="central">D076, handover note</text></g>
<line x1="500" y1="108" x2="500" y2="132" class="arr" marker-end="url(#arrow)"/><line x1="500" y1="192" x2="500" y2="216" class="arr" marker-end="url(#arrow)"/><line x1="500" y1="276" x2="500" y2="300" class="arr" marker-end="url(#arrow)"/>
<path d="M500 360 L500 372 L430 372 L430 384" class="arr" marker-end="url(#arrow)"/><path d="M500 360 L500 372 L570 372 L570 384" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="360" y="388" width="136" height="76" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="428" y="408" text-anchor="middle" dominant-baseline="central">Before</text><text class="ts" x="428" y="428" text-anchor="middle" dominant-baseline="central">Retype 43 KB</text><text class="ts" x="428" y="446" text-anchor="middle" dominant-baseline="central">into a card</text></g>
<g class="c-teal"><rect x="504" y="388" width="136" height="76" rx="8" stroke-width="0.5"/><text class="th" x="572" y="408" text-anchor="middle" dominant-baseline="central">Now</text><text class="ts" x="572" y="428" text-anchor="middle" dominant-baseline="central">Nothing to save</text><text class="ts" x="572" y="446" text-anchor="middle" dominant-baseline="central">next task sees it</text></g>
<g class="c-coral"><rect x="40" y="480" width="16" height="16" rx="3" stroke-width="0.5" stroke-dasharray="4 3"/></g><text class="ts" x="64" y="488" dominant-baseline="central">Old way, retired</text>
<g class="c-teal"><rect x="200" y="480" width="16" height="16" rx="3" stroke-width="0.5"/></g><text class="ts" x="224" y="488" dominant-baseline="central">Library file and pointer path</text>
</svg>
